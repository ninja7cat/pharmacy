name: Check build

# Builds every branch except main, so changes are tested before they go live.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          # Show each finding as a note on the run, so it is easy to read.
          grep ' • ' analyze.txt | head -50 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit $code
      - run: flutter build web --release
