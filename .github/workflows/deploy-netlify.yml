name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - name: Deploy to Netlify
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is missing or empty"
            exit 1
          fi
          set +e
          npx --yes netlify-cli deploy --dir=build/web --prod --site=dianepharmacy --auth="$NETLIFY_AUTH_TOKEN" > deploy.log 2>&1
          code=$?
          cat deploy.log
          if [ $code -ne 0 ]; then
            msg=$(grep -v '^\s*$' deploy.log | tail -8 | tr '\n' ' ' | sed "s/$NETLIFY_AUTH_TOKEN/***/g")
            echo "::error::Netlify deploy failed: $msg"
          fi
          exit $code
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
