<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Title (English + Arabic) -->
  <title>Diane Pharmacy | صيدلية ديان</title>

  <!-- Basic SEO -->
  <meta
    name="description"
    content="Diane Pharmacy - your trusted local pharmacy. Medicines, health advice, wellness and family care. صيدلية ديان - صيدليتكم المحلية الموثوقة."
  >
  <meta name="author" content="Diane Pharmacy">

  <!-- Browser theme (address bar colour on phones) -->
  <meta name="theme-color" content="#ffffff">

  <!-- Prevent unwanted phone-number auto detection -->
  <meta name="format-detection" content="telephone=no">

  <!-- Icons -->
  <link rel="icon" type="image/jpeg" sizes="32x32" href="assets/assets/images/pharmacy_logo.jpg?v=3">
  <link rel="shortcut icon" href="assets/assets/images/pharmacy_logo.jpg?v=3">
  <link rel="apple-touch-icon" href="assets/assets/images/pharmacy_logo.jpg?v=3">
  <meta name="apple-mobile-web-app-title" content="Diane Pharmacy">

  <!-- Web app manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / Facebook / WhatsApp / Instagram / Messenger -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Diane Pharmacy">
  <meta property="og:title" content="Diane Pharmacy | صيدلية ديان">
  <meta
    property="og:description"
    content="Your trusted local pharmacy - medicines, health advice and family care. صيدليتكم المحلية الموثوقة."
  >
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_AR">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Diane Pharmacy | صيدلية ديان">
  <meta
    name="twitter:description"
    content="Your trusted local pharmacy - medicines, health advice and family care. صيدليتكم المحلية الموثوقة."
  >

  <!--
    ADD THESE TWO LINES AFTER DEPLOYMENT, with the real permanent URL.
    Link previews need ABSOLUTE https:// addresses. Put the image file in the
    web/ folder (for example web/og-image.png, 1200x630 or square 1200x1200).

    <meta property="og:url" content="https://YOUR-FINAL-URL/">
    <meta property="og:image" content="https://YOUR-FINAL-URL/og-image.png">
    <meta name="twitter:image" content="https://YOUR-FINAL-URL/og-image.png">
    <link rel="canonical" href="https://YOUR-FINAL-URL/">
  -->

  <!--
    Faster loading: start downloading everything the app needs right away,
    in parallel, instead of Flutter fetching each file one after another.
  -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Cairo-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Cairo-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Cairo-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Cairo-ExtraBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/images/pharmacy_logo.jpg" as="fetch" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Loading screen in the site's own colours, shown until it is ready -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F6F5F1;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #F6F5F1;
      color: #013973;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    #splash .ring {
      position: relative;
      width: 92px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #splash .ring::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(29, 79, 163, 0.14);
      border-top-color: #1D4FA3;
      border-right-color: #D2B070;
      animation: spin 0.9s linear infinite;
    }

    #splash .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #EEF2F7 center / 118% no-repeat
        url("assets/assets/images/pharmacy_logo.jpg");
      animation: breathe 1.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      50% { transform: scale(0.94); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .ring::before,
      #splash .logo { animation-duration: 3s; }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="ring"><div class="logo"></div></div>
    <div>Diane Pharmacy</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 500);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
